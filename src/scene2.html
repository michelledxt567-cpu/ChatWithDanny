// ---------- wallpaper doodles ----------
function buildWall() {
  const r = rng(7);
  const S = 240; let g = '';
  const col = '#DCD2C4';
  for (let i = 0; i < 46; i++) {
    const x = r() * S, y = r() * S, s = 7 + r() * 7, rot = r() * 360, k = Math.floor(r() * 8);
    let p = '';
    if (k === 0) p = `<circle cx="0" cy="0" r="${s * 0.7}"/>`;
    else if (k === 1) p = `<path d="M0 ${s*0.6} C${-s} ${-s*0.2} ${-s*0.3} ${-s} 0 ${-s*0.3} C${s*0.3} ${-s} ${s} ${-s*0.2} 0 ${s*0.6}Z"/>`;
    else if (k === 2) p = `<path d="M0 ${-s} L${s*0.3} ${-s*0.3} L${s} ${-s*0.3} L${s*0.45} ${s*0.15} L${s*0.65} ${s} L0 ${s*0.5} L${-s*0.65} ${s} L${-s*0.45} ${s*0.15} L${-s} ${-s*0.3} L${-s*0.3} ${-s*0.3}Z"/>`;
    else if (k === 3) p = `<rect x="${-s*0.6}" y="${-s*0.6}" width="${s*1.2}" height="${s*1.2}" rx="${s*0.3}"/>`;
    else if (k === 4) p = `<path d="M${-s} 0 Q${-s*0.5} ${-s} 0 0 T${s} 0"/>`;
    else if (k === 5) p = `<path d="M${-s*0.4} ${s*0.7} V${-s*0.6} L${s*0.6} ${-s*0.8} V${s*0.4}"/><circle cx="${-s*0.6}" cy="${s*0.7}" r="${s*0.25}"/><circle cx="${s*0.4}" cy="${s*0.4}" r="${s*0.25}"/>`;
    else if (k === 6) p = `<path d="M${-s*0.8} ${s*0.3} a${s*0.4} ${s*0.4} 0 0 1 ${s*0.3} ${-s*0.75} a${s*0.5} ${s*0.5} 0 0 1 ${s*0.9} ${-s*0.1} a${s*0.38} ${s*0.38} 0 0 1 ${s*0.4} ${s*0.85}Z"/>`;
    else p = `<path d="M${s*0.3} ${-s*0.8} A${s*0.8} ${s*0.8} 0 1 0 ${s*0.3} ${s*0.8} A${s*0.6} ${s*0.6} 0 1 1 ${s*0.3} ${-s*0.8}Z"/>`;
    g += `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${rot.toFixed(0)})">${p}</g>`;
  }
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${S}" height="${S}"><g fill="none" stroke="${col}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${g}</g></svg>`;

}

// ---------- keyboard ----------
const KB_H = 330;
const KEYS = {};   // id -> {el, x, y, w, h, layer, kind}
function addKey(layer, id, label, x, y, w, h, kind) {
  const el = document.createElement('div');
  el.className = 'key' + (kind === 'sp' ? ' sp' : '') + (kind === 'small' ? ' small' : '');
  el.style.cssText = `left:${x}px;top:${y}px;width:${w}px;height:${h}px`;
  el.innerHTML = label;
  $(layer).appendChild(el);
  KEYS[layer + ':' + id] = { el, x, y, w, h, layer, kind, label };
  return el;
}
const SHIFT_OFF = `<svg width="20" height="19" viewBox="0 0 20 19"><path d="M10 1.5 L18.5 10 H13.5 V17.5 H6.5 V10 H1.5 Z" fill="none" stroke="#000" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
const SHIFT_ON  = `<svg width="20" height="19" viewBox="0 0 20 19"><path d="M10 1.5 L18.5 10 H13.5 V17.5 H6.5 V10 H1.5 Z" fill="#000" stroke="#000" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
const DEL = `<svg width="25" height="18" viewBox="0 0 25 18"><path d="M8 1.5 H21.5 a2 2 0 0 1 2 2 V14.5 a2 2 0 0 1 -2 2 H8 L1.5 9 Z" fill="none" stroke="#000" stroke-width="1.6" stroke-linejoin="round"/><path d="M11.5 5.5 L18 12 M18 5.5 L11.5 12" stroke="#000" stroke-width="1.6" stroke-linecap="round"/></svg>`;
function buildKeyboard() {
  const W = 393, kw = 33.3, g = 6, kh = 42, rows = [52, 106, 160, 214];
  'qwertyuiop'.split('').forEach((c, i) => addKey('abc', c, c, 3 + i * (kw + g), rows[0], kw, kh));
  const r2 = (W - (9 * kw + 8 * g)) / 2;
  'asdfghjkl'.split('').forEach((c, i) => addKey('abc', c, c, r2 + i * (kw + g), rows[1], kw, kh));
  const r3 = (W - (7 * kw + 6 * g)) / 2;
  'zxcvbnm'.split('').forEach((c, i) => addKey('abc', c, c, r3 + i * (kw + g), rows[2], kw, kh));
  addKey('abc', 'SHIFT', SHIFT_ON, 3, rows[2], 42, kh, 'sp');
  addKey('abc', 'BS', DEL, W - 45, rows[2], 42, kh, 'sp');
  addKey('abc', '123', '123', 3, rows[3], 88, kh, 'sp');
  addKey('abc', 'SP', 'space', 97, rows[3], 199, kh, 'small');
  addKey('abc', 'RET', 'return', 302, rows[3], 88, kh, 'sp');
  // number layer
  '1234567890'.split('').forEach((c, i) => addKey('num', c, c, 3 + i * (kw + g), rows[0], kw, kh));
  ['-', '/', ':', ';', '(', ')', '$', '&amp;', '@', '“'].forEach((c, i) => addKey('num', 'n' + i, c, 3 + i * (kw + g), rows[1], kw, kh));
  addKey('num', 'SYM', '#+=', 3, rows[2], 47, kh, 'sp');
  const pw = (W - 3 - 47 - 6 - 47 - 3 - 6 - 4 * 6) / 5;
  ['.', ',', '?', '!', '’'].forEach((c, i) => addKey('num', c === '.' ? '.' : 'p' + i, c, 56 + i * (pw + g), rows[2], pw, kh));
  addKey('num', 'BS', DEL, W - 50, rows[2], 47, kh, 'sp');
  addKey('num', 'ABC', 'ABC', 3, rows[3], 88, kh, 'sp');
  addKey('num', 'SP', 'space', 97, rows[3], 199, kh, 'small');
  addKey('num', 'RET', 'return', 302, rows[3], 88, kh, 'sp');
  // predictive bar
  $('pred').innerHTML = `<div class="pc" id="pc0" style="left:4px"></div><div class="pdiv" style="left:131px"></div>
    <div class="pc" id="pc1" style="left:134px"></div><div class="pdiv" style="left:261px"></div><div class="pc" id="pc2" style="left:264px"></div>`;
}

// ---------- typing helpers (shared with video 1) ----------
function textState(t) {
  let text = '', layer = 'abc', sent = false, lastAct = -10;
  for (const a of SCRIPT) {
    if (a.t > t) break;
    lastAct = a.t;
    const shift = text === '' && layer === 'abc';
    if (a.k === 'BS') text = text.slice(0, -1);
    else if (a.k === 'SP') {
      const m = text.match(/(\S+)$/);
      if (m && AUTOCORRECT[m[1]]) text = text.slice(0, -m[1].length) + AUTOCORRECT[m[1]];
      text += ' ';
    }
    else if (a.k === '123') layer = 'num';
    else if (a.k === 'ABC') layer = 'abc';
    else if (a.k === 'SEND') { sent = true; text = ''; layer = 'abc'; }
    else text += (shift ? a.k.toUpperCase() : a.k);
  }
  const shift = text === '' && layer === 'abc';
  return { text, layer, shift, sent, lastAct };
}
function suggestions(text) {
  if (text === '') return { s: ['I', 'Hey', 'The'], hl: -1 };
  if (/[.?!]$/.test(text)) return { s: ['I', 'Thanks', 'Ok'], hl: -1 };
  const m = text.match(/(\S*)$/); const w = m[1];
  if (w === '') {
    const prev = (text.trim().split(/\s+/).pop()) || '';
    return { s: NEXT[prev] || ['the', 'to', 'I'], hl: -1 };
  }
  if (AUTOCORRECT[w]) return { s: [`“${w}”`, AUTOCORRECT[w], w === 'Im' ? 'In' : 'checks'], hl: 1 };
  const c = DICT.filter((d) => d.toLowerCase().startsWith(w.toLowerCase()) && d !== w);
  return { s: [`“${w}”`, c[0] || w, c[1] || ''], hl: -1 };
}


function kbRender(t, kbP, st) {
  // keyboard layer + keys
  if (kbP > 0) {
    if (st.layer !== lastLayer) {
      $('abc').style.display = st.layer === 'abc' ? 'block' : 'none';
      $('num').style.display = st.layer === 'num' ? 'block' : 'none';
      lastLayer = st.layer;
    }
    for (const k of Object.values(KEYS)) {
      if (k.layer === 'abc' && k.label.length === 1) k.el.textContent = st.shift ? k.label.toUpperCase() : k.label;
      k.el.classList.remove('pressedW', 'pressedG');
    }
    const sh = KEYS['abc:SHIFT'];
    sh.el.innerHTML = st.shift ? SHIFT_ON : SHIFT_OFF;
    sh.el.style.background = st.shift ? '#fff' : '#ABB0BC';

    // pressed key + popup
    const pop = $('popup');
    pop.style.display = 'none';
    const act = SCRIPT.find((a) => t >= a.t && t < a.t + 0.1 && a.k !== 'SEND');
    if (act) {
      // the key that was pressed belongs to the layer active *before* the action
      const before = textState(act.t - 0.0001);
      const layer = before.layer;
      const id = act.k.length === 1 ? act.k.toLowerCase() : act.k;
      const key = KEYS[layer + ':' + id];
      if (key) {
        if (key.kind === 'sp' || key.kind === 'small') {
          key.el.classList.add(key.kind === 'small' ? 'pressedG' : 'pressedW');
        } else {
          const lbl = layer === 'abc' ? (before.shift ? id.toUpperCase() : id) : key.label;
          const bw = key.w + 22, bh = 54;
          const left = clamp(key.x - 11, 1, 393 - bw - 1);
          pop.style.display = 'block';
          pop.style.left = '0px'; pop.style.top = '0px';
          const bulb = pop.querySelector('.bulb'), stem = pop.querySelector('.stem'), neck = pop.querySelector('.neck');
          bulb.style.cssText = `left:${left}px;top:${key.y - bh - 10}px;width:${bw}px;height:${bh}px`;
          bulb.textContent = lbl;
          neck.style.cssText = `left:${key.x}px;top:${key.y - 14}px;width:${key.w}px;height:16px`;
          stem.style.cssText = `left:${key.x}px;top:${key.y}px;width:${key.w}px;height:${key.h}px`;
        }
      }
    }
    // predictive text bar
    const sg = suggestions(st.text);
    for (let i = 0; i < 3; i++) {
      const el = $('pc' + i);
      el.textContent = sg.s[i] || '';
      el.classList.toggle('hl', sg.hl === i);
    }
  }

}

// ======================= VIDEO 2 =======================
// 8:23 PM outside Danny's dad's old house: wake phone -> swipe to Camera -> flash on -> photo ->
// close camera -> unlock -> WhatsApp -> send photo + "I'm here." -> no service, both fail.

const V = {
  wake: 0.45, camSwipe: [2.35, 2.8], camLive: 3.0,
  barsDip: 4.9, flashTap: 5.5, sigDrop: 6.6, shot: 7.7,
  closeCam: [10.3, 10.75], faceId: 10.95, unlock: [11.85, 12.35],
  minute: 12.9, waTap: 13.55, launch: [13.67, 14.12],
  camIcon: 16.0, waCamIn: [16.05, 16.42], pick: 18.1, prevIn: [18.15, 18.45],
  prevSend: 20.1, prevOut: [20.15, 20.45], field: 21.9, kb: [21.95, 22.35],
};
const SHOT = { pre: V.shot + 0.1, main: V.shot + 0.42, blink: V.shot + 0.47, thumb: V.shot + 0.62 };

// ---- typing ----
const SCRIPT = [];
const T = {};
(function () {
  const r = rng(77);
  let t = 22.85;
  const tap = (k, dt) => { SCRIPT.push({ t, k }); t += dt; };
  for (const ch of 'Im') tap(ch, 0.19 + r() * 0.1);
  tap('SP', 0.24);
  for (const ch of 'here') tap(ch, 0.17 + r() * 0.1);
  t += 0.2;
  tap('123', 0.38); tap('.', 0.2);
  t += 0.75;
  T.send = t; SCRIPT.push({ t, k: 'SEND' });
})();
V.txSent = T.send;
V.phFail = T.send + 3.6;
V.txFail = T.send + 6.1;
const END = T.send + 10.2;
window.DURATION = END;

const AUTOCORRECT = { 'Im': 'I’m' };
const DICT = ['I', 'I’m', 'In', 'It', 'here', 'hey', 'her', 'help', 'hers', 'heading'];
const NEXT = { 'I’m': ['here', 'so', 'outside'] };

// ---------- photo of the house (rendered once, same for every worker) ----------
const BASE = { cam: [0.35, 1.55, 7.6], target: [0.2, 2.75, 0], fov: 65 };
const BASE_WA = { cam: [0.4, 1.45, 7.9], target: [0.25, 2.6, 0], fov: 82 };
let drawVF = null, drawWA = null, PHOTO = '';
function makePhoto() {
  const c = document.createElement('canvas'); c.width = 886; c.height = 1181;
  const draw = HOUSE3D.create(c);
  draw({ ...HOUSE3D.handheld(SHOT.main, BASE, 0.6), exposure: 1.0, flash: 1, grain: 0.035, seed: 9, desat: 0.05 });
  return c.toDataURL('image/jpeg', 0.92);
}

// ---------- layout ----------
const L = {};
function measure() {
  L.H = $('content').offsetHeight;
  L.phH = $('phInner').offsetHeight;
  L.txH = $('txInner').offsetHeight;
}
const BAR_H0 = 50, SAFE = 34, SCREEN_H = 852;
function barTopFor(kbP, barH) {
  const kbTop = SCREEN_H - KB_H * kbP;
  return kbP > 0 ? Math.min(SCREEN_H - SAFE - barH, kbTop - barH) : SCREEN_H - SAFE - barH;
}

const MODES = [['SLO-MO', 52], ['VIDEO', 128], ['PHOTO', 196.5], ['PORTRAIT', 274], ['PANO', 349]];
const FLASH_OFF = `<svg width="30" height="30" viewBox="0 0 30 30"><circle cx="15" cy="15" r="14" fill="rgba(40,40,40,.65)"/><path d="M16.5 6 9.5 16h5l-1.5 8 7.5-10.5h-5l1.5-7.5Z" fill="#fff"/><path d="M8 7l14 16" stroke="rgba(40,40,40,1)" stroke-width="3.4"/><path d="M8 7l14 16" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg>`;
const FLASH_ON = `<svg width="30" height="30" viewBox="0 0 30 30"><circle cx="15" cy="15" r="14" fill="#FFD60A"/><path d="M16.5 6 9.5 16h5l-1.5 8 7.5-10.5h-5l1.5-7.5Z" fill="#000"/></svg>`;
const NIGHT = `<div style="display:flex;align-items:center;gap:3px;background:#FFD60A;color:#000;border-radius:15px;height:28px;padding:0 9px 0 6px;font-size:13px;font-weight:700">
  <svg width="17" height="17" viewBox="0 0 18 18"><path d="M11 2a7 7 0 1 0 5 11 5.6 5.6 0 0 1-5-11Z" fill="#000"/></svg>3s</div>`;
const RING = (p) => `<svg width="52" height="52" viewBox="0 0 52 52"><circle cx="26" cy="26" r="25" fill="rgba(0,0,0,.45)"/>
  <circle cx="26" cy="26" r="20" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="3"/>
  <circle cx="26" cy="26" r="20" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-dasharray="${(125.7 * p).toFixed(1)} 200" transform="rotate(-90 26 26)"/>
  <path d="M20 20 32 32M32 20 20 32" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg>`;
const RETRY = `<div style="display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.55);color:#fff;border-radius:18px;height:36px;padding:0 15px 0 11px;font-size:15px;font-weight:600">
  <svg width="16" height="18" viewBox="0 0 16 18"><path d="M8 16V3M3 8l5-5 5 5" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>Retry</div>`;
const WHITE_CLOCK = `<svg width="13" height="13" viewBox="0 0 13 13"><circle cx="6.5" cy="6.5" r="5.2" fill="none" stroke="#fff" stroke-width="1.2"/><path d="M6.5 3.6 V6.7 L8.6 7.9" fill="none" stroke="#fff" stroke-width="1.2" stroke-linecap="round"/></svg>`;

function setOnce(el, key, html) { if (el.dataset.k !== key) { el.innerHTML = html; el.dataset.k = key; } }
const ease = (t, a, b, f = easeOut3) => f(clamp((t - a) / (b - a), 0, 1));
let lastLayer = '';

// ---------- one frame ----------
window.render = function (t) {
  // ===== chat (inside #app) =====
  const kbP = ease(t, V.kb[0], V.kb[1], easeOut4);
  $('kb').style.top = (SCREEN_H - KB_H * kbP) + 'px';
  $('kb').style.display = kbP > 0 ? 'block' : 'none';
  const st = textState(t);
  const typing = st.text.length > 0;
  $('txt').textContent = st.text;
  $('field').style.width = (typing ? 294 : 246) + 'px';
  $('cam').style.display = typing ? 'none' : 'block';
  $('mic').style.display = typing ? 'none' : 'block';
  $('send').style.display = typing ? 'flex' : 'none';
  const since = t - st.lastAct;
  $('caret').style.opacity = kbP > 0.6 && (since < 0.45 || Math.floor((since - 0.45) / 0.5) % 2 === 1) ? 1 : 0;
  $('caret').style.display = kbP > 0 ? 'inline-block' : 'none';
  const barH = Math.max(BAR_H0, $('field').offsetHeight + 14);
  const barTop = barTopFor(kbP, barH);
  $('bar').style.top = barTop + 'px';
  $('bar').style.height = (SCREEN_H - barTop) + 'px';
  $('bar').querySelector('.inner').style.height = barH + 'px';
  $('cam').classList.toggle('press', t >= V.camIcon && t < V.camIcon + 0.12);
  $('send').classList.toggle('press', t >= T.send && t < T.send + 0.1);

  // photo message
  const gp = t >= V.prevOut[1] ? ease(t, V.prevOut[1], V.prevOut[1] + 0.26) : 0;
  $('phWrap').style.height = (L.phH * gp) + 'px';
  $('phRow').style.opacity = clamp(gp * 1.6, 0, 1);
  $('phRow').style.transform = `translateY(${(1 - gp) * 14}px)`;
  const phFailed = t >= V.phFail;
  const up = clamp((t - V.prevOut[1] - 0.3) / 1.6, 0, 1);
  setOnce($('phOv'), phFailed ? 'f' : 'r' + Math.round(up * 40), phFailed ? RETRY : RING(0.03 + 0.09 * easeOut3(up)));
  setOnce($('phTk'), 'c', WHITE_CLOCK);
  $('phFail').style.visibility = phFailed ? 'visible' : 'hidden';
  $('phFail').style.transform = `scale(${phFailed ? 1 + 0.25 * Math.max(0, 1 - (t - V.phFail) / 0.18) : 1})`;

  // text message
  const gt = t >= T.send ? ease(t, T.send, T.send + 0.24) : 0;
  $('txWrap').style.height = (L.txH * gt) + 'px';
  $('txRow').style.opacity = clamp(gt * 1.6, 0, 1);
  $('txRow').style.transform = `translateY(${(1 - gt) * 14}px)`;
  setOnce($('txTk'), 'c', ticks('clock'));
  const txFailed = t >= V.txFail;
  $('txFail').style.visibility = txFailed ? 'visible' : 'hidden';
  $('txFail').style.transform = `scale(${txFailed ? 1 + 0.25 * Math.max(0, 1 - (t - V.txFail) / 0.18) : 1})`;

  const H = L.H + L.phH * gp + L.txH * gt;
  $('content').style.transform = `translateY(${(barTop - H).toFixed(2)}px)`;
  $('down').style.opacity = 0;
  kbRender(t, kbP, st);

  // ===== WhatsApp camera + preview (inside #app) =====
  const wc = t < V.waCamIn[0] ? 0 : ease(t, V.waCamIn[0], V.waCamIn[1], easeOut4);
  const waCamOn = wc > 0 && t < V.prevIn[1];
  $('waCam').style.display = waCamOn ? 'block' : 'none';
  if (waCamOn) {
    $('waCam').style.transform = `translateY(${(1 - wc) * 852}px)`;
    drawWA({ ...HOUSE3D.handheld(t, BASE_WA, 1.2), exposure: 2.7, grain: 0.07, seed: Math.floor(t * 30), desat: 0.5, moon: 1 });
    $('waStrip').firstChild.classList.toggle('press', t >= V.pick && t < V.pick + 0.15);
  }
  const pv = t < V.prevIn[0] ? 0 : ease(t, V.prevIn[0], V.prevIn[1]);
  const po = t < V.prevOut[0] ? 0 : ease(t, V.prevOut[0], V.prevOut[1], easeInOut);
  const prevOn = pv > 0 && po < 1;
  $('waPrev').style.display = prevOn ? 'block' : 'none';
  if (prevOn) {
    $('waPrev').style.opacity = pv;
    $('waPrev').style.transform = `translateY(${po * 852}px) scale(${0.96 + 0.04 * pv})`;
    $('prevSend').classList.toggle('press', t >= V.prevSend && t < V.prevSend + 0.12);
  }

  // ===== iOS Camera app =====
  const cs = t < V.camSwipe[0] ? 0 : ease(t, V.camSwipe[0], V.camSwipe[1], easeOut3);
  const cc = t < V.closeCam[0] ? 0 : ease(t, V.closeCam[0], V.closeCam[1], easeOut3);
  const camOn = cs > 0 && cc < 1;
  $('camApp').style.display = camOn ? 'block' : 'none';
  if (camOn) {
    $('camApp').style.transform = `translate(${(1 - cs) * 393}px, ${-cc * 852}px) scale(${1 - 0.12 * cc})`;
    $('camApp').style.borderRadius = cc > 0 ? '44px' : '0';
    const live = clamp((t - V.camLive) / 0.3, 0, 1);
    $('vfBlack').style.opacity = 1 - live;
    const flashOn = t >= V.flashTap;
    if (live > 0) {
      let flash = 0, exposure = 2.7 * (0.8 + 0.2 * ease(t, V.camLive, V.camLive + 0.8)), grain = 0.07, desat = 0.45;
      if (t >= SHOT.pre && t < SHOT.main + 0.07) {
        const main = t >= SHOT.main;
        flash = main ? 1 : 0.3; exposure = main ? 1.0 : 1.7; grain = main ? 0.03 : 0.06; desat = main ? 0.05 : 0.25;
      }
      drawVF({ ...HOUSE3D.handheld(t, BASE, t > V.shot - 0.6 && t < SHOT.main + 0.1 ? 0.6 : 1), exposure, flash, grain, desat, seed: Math.floor(t * 30), moon: 1 });
    }
    $('shutFx').style.opacity = t >= SHOT.blink && t < SHOT.blink + 0.09 ? 1 : 0;
    setOnce($('flashBtn'), flashOn ? 'on' : 'off', flashOn ? FLASH_ON : FLASH_OFF);
    $('flashBtn').style.transform = `scale(${t >= V.flashTap && t < V.flashTap + 0.15 ? 0.85 : 1})`;
    setOnce($('nightBtn'), flashOn ? 'x' : 'n', flashOn ? '' : NIGHT);
    $('flashPill').style.opacity = t < V.flashTap ? 0 : clamp(Math.min((t - V.flashTap) / 0.15, (V.flashTap + 1.5 - t) / 0.3), 0, 1);
    const pressed = t >= V.shot && t < V.shot + 0.14;
    $('shutterIn').style.transform = `scale(${pressed ? 0.86 : 1})`;
    const th = $('thumb');
    if (t >= SHOT.thumb) {
      setOnce(th, 'p', `<img src="${PHOTO}">`);
      const a = ease(t, SHOT.thumb, SHOT.thumb + 0.3);
      th.firstChild.style.transform = `scale(${0.4 + 0.6 * a})`; th.firstChild.style.opacity = a;
    } else setOnce(th, 'old', '<div style="width:100%;height:100%;background:linear-gradient(135deg,#d9c38a,#8a5a36 60%,#3b2a22)"></div>');
  }

  // ===== system: lock screen, home screen, app launch =====
  const sw = t < V.unlock[0] ? 0 : ease(t, V.unlock[0], V.unlock[1], easeOut3);
  const lp = t < V.launch[0] ? 0 : ease(t, V.launch[0], V.launch[1], easeOut4);
  const lockVisible = sw < 1 && !(cs >= 1 && cc <= 0);
  PHONE.lock(lockVisible ? { show: true, x: cc > 0 ? 0 : -cs * 393 * 0.35, y: -852 * sw, time: t < V.minute ? '8:23' : '8:24',
    pad: t < V.closeCam[0] ? 0 : clamp((t - V.faceId) / 0.3, 0, 1), reveal: 1, hint: t > V.closeCam[1] ? clamp((t - V.faceId - 0.3) / 0.2, 0, 1) * (1 - sw) : 0,
    fade: clamp(sw * 3, 0, 1) } : null);
  PHONE.home(sw > 0 && lp < 1 ? { show: true, scale: (1.12 - 0.12 * sw) * (1 + 0.06 * lp), opacity: sw, dim: 0.25 * lp,
    pressed: t >= V.waTap && t < V.launch[0] + 0.05 ? 'whatsapp' : null, hidden: lp > 0 ? 'whatsapp' : null } : null);
  PHONE.launch(t < V.launch[0] ? 0 : (lp >= 1 ? null : lp));
  PHONE.blackout(t < V.wake ? 1 : 1 - clamp((t - V.wake) / 0.16, 0, 1));

  // ===== status bar =====
  const inApp = lp > 0.55;
  const noSvc = t >= V.sigDrop;
  const bars = noSvc ? 0 : (t >= V.barsDip ? 1 : 2);
  const onLockOnly = lockVisible && cs < 0.5 && sw < 0.5;
  const fullscreenWA = (waCamOn && wc > 0.6) || (prevOn && po < 0.4);
  PHONE.status({ show: t >= V.wake && !fullscreenWA, color: inApp ? '#000' : '#fff', time: t < V.minute ? '8:23' : '8:24',
    carrier: onLockOnly || (lockVisible && cc >= 0.5 && sw < 0.5) ? (noSvc ? 'No Service' : 'T-Mobile') : null,
    bars, net: noSvc ? null : '3G', battery: 3.9 });
  PHONE.homeInd({ show: t >= V.wake && !fullscreenWA, color: inApp && !waCamOn ? '#000' : '#fff' });
};

// ---------- sound cues ----------
function soundCues() {
  const c = [];
  c.push({ t: 0.05, k: 'shaky', g: 0.9 });
  c.push({ t: V.wake - 0.04, k: 'button' });
  c.push({ t: 1.2, k: 'exhale', g: 0.9 });
  c.push({ t: V.camSwipe[0] - 0.05, k: 'swipe' });
  c.push({ t: 3.7, k: 'shuffle', g: 0.9, d: 0.55 });
  c.push({ t: 4.4, k: 'shaky', g: 0.85 });
  c.push({ t: V.flashTap, k: 'tap' });
  c.push({ t: V.shot - 1.05, k: 'inhale', g: 0.9 });
  c.push({ t: V.shot, k: 'tap' });
  c.push({ t: SHOT.main - 0.02, k: 'shutter' });
  c.push({ t: SHOT.main + 0.8, k: 'exhale', g: 0.9 });
  c.push({ t: 9.3, k: 'creak', g: 0.8, d: 1.0 });
  c.push({ t: V.closeCam[0] - 0.05, k: 'swipe', g: 0.9 });
  c.push({ t: V.unlock[0] - 0.05, k: 'swipe' });
  c.push({ t: 12.8, k: 'shaky', g: 0.8 });
  c.push({ t: V.waTap, k: 'tap' });
  c.push({ t: 15.0, k: 'bark', g: 0.9 });
  c.push({ t: V.camIcon, k: 'tap' });
  c.push({ t: V.pick, k: 'tap' });
  c.push({ t: 19.0, k: 'shuffle', g: 0.7, d: 0.5 });
  c.push({ t: V.prevSend, k: 'tap' });
  c.push({ t: V.field, k: 'tap' });
  for (const a of SCRIPT) {
    if (a.k === 'SEND') { c.push({ t: a.t, k: 'tap' }); continue; }
    c.push({ t: a.t, k: ['SP', '123', 'ABC', 'RET', 'SHIFT'].includes(a.k) ? 'keyMod' : 'key' });
  }
  c.push({ t: V.phFail - 0.6, k: 'creak', g: 0.55, d: 0.8 });
  c.push({ t: V.phFail + 0.5, k: 'shaky', g: 0.95 });
  c.push({ t: V.txFail + 0.4, k: 'sigh', g: 0.95 });
  c.push({ t: V.txFail + 2.4, k: 'bark', g: 0.6 });
  c.push({ t: END - 1.6, k: 'inhale', g: 0.75 });
  return c.filter((x) => x.t < END).sort((a, b) => a.t - b.t);
}

// ---------- init ----------
buildWall(); buildChat(); buildKeyboard();
PHONE.build($('screen'), {
  date: 'Saturday, November 14', lockTime: '8:23', dayName: 'Saturday', dayNum: 14,
  weather: { city: 'Portland', temp: 41, cond: 'Mostly Cloudy', hi: 52, lo: 38 },
  badges: { instagram: 5, snapchat: 3, discord: 9, gmail: 31 },
  notifs: [],
});
$('modes').innerHTML = MODES.map(([m, x]) => `<span style="left:${x}px;${m === 'PHOTO' ? 'color:#FFD60A' : ''}">${m}</span>`).join('');
window.ready = Promise.all([document.fonts.ready, document.fonts.load('600 108px LockClock')]).then(async () => {
  PHOTO = makePhoto();
  drawVF = HOUSE3D.create($('vfCanvas'));
  drawWA = HOUSE3D.create($('waCanvas'));
  const others = ['linear-gradient(160deg,#1b1b2f,#e94560 55%,#f5d76e)', 'linear-gradient(135deg,#d9c38a,#8a5a36 60%,#3b2a22)',
    'linear-gradient(200deg,#89a7c2,#3e5a75 50%,#1d2a36)', 'linear-gradient(120deg,#f0e6d2,#c7a27c 50%,#6b4f3a)', 'linear-gradient(180deg,#f6a35b,#7d3f6b)'];
  $('waStrip').innerHTML = `<div class="st"><img src="${PHOTO}"></div>` + others.map((g) => `<div class="st"><div style="background:${g}"></div></div>`).join('');
  for (const id of ['prevImg', 'phImg']) $(id).src = PHOTO;
  await Promise.all([...document.images].map((im) => im.decode().catch(() => {})));
  measure();
  window.SOUNDS = soundCues();
  window.render(0);
  return true;
});
